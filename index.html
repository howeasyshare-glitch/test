<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>今天吃什麼？隨機餐廳幫你決定</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at top, #f5f5f5 0, #e0f2f1 40%, #b2dfdb 100%);
      display: flex;
      justify-content: center;
    }
    .app {
      max-width: 960px;
      width: 100%;
      background: #ffffffee;
      border-radius: 18px;
      padding: 18px 20px 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.1);
      border: 1px solid #e0f2f1;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }
    .subtitle {
      font-size: 13px;
      color: #607d8b;
      margin-bottom: 14px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    label {
      font-size: 14px;
    }
    input[type="number"] {
      width: 80px;
      padding: 6px 8px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #b0bec5;
    }
    button {
      border-radius: 999px;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      background: #00bfa5;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 10px rgba(0,191,165,0.4);
      transition: transform 0.05s ease-out, box-shadow 0.05s ease-out;
    }
    button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(0,191,165,0.4);
    }
    button.secondary {
      background: #eceff1;
      color: #455a64;
      box-shadow: none;
      border: 1px solid #cfd8dc;
    }
    #statusMsg {
      font-size: 13px;
      color: #455a64;
      margin-top: 4px;
      min-height: 18px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 16px;
      margin-top: 14px;
    }
    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
    .panel {
      border-radius: 12px;
      border: 1px solid #eceff1;
      padding: 10px 12px;
      background: #fafafa;
    }
    .panel h2 {
      font-size: 14px;
      margin: 0 0 6px;
      color: #546e7a;
    }
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      max-height: 170px;
      overflow-y: auto;
      font-size: 13px;
    }
    .cat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #eceff1;
    }
    .random-controls {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .restaurant-card {
      font-size: 14px;
      line-height: 1.5;
    }
    .restaurant-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0 8px;
      font-size: 12px;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 999px;
      background: #e0f2f1;
      color: #00695c;
    }
    a {
      color: #00796b;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .small {
      font-size: 12px;
      color: #78909c;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>今天吃什麼？讓我幫你抽一家 🍽️</h1>
    <div class="subtitle">
      1. 偵測你的位置 → 2. 搜尋附近餐廳 → 3. 選分類 → 4. 幫你抽籤
    </div>

    <div class="controls">
      <label>搜尋半徑
        <input id="radiusInput" type="number" value="3" min="1" max="10" /> 公里
      </label>
      <button id="locateBtn">📍 偵測我的位置並搜尋餐廳</button>
      <button id="reshuffleBtn" class="secondary" disabled>🎲 再抽一次</button>
    </div>
    <div id="statusMsg"></div>

    <div class="layout">
      <div class="panel">
        <h2>選擇你有興趣的餐廳類型</h2>
        <div id="categoryList" class="categories"></div>
        <div class="random-controls">
          <button id="startRandomBtn" disabled>開始抽籤 🎯</button>
          <span style="font-size:12px;color:#78909c;">（可勾選 1 種以上類別）</span>
        </div>
      </div>

      <div class="panel">
        <h2>抽到的餐廳</h2>
        <div id="restaurantResult" class="restaurant-card">
          還沒有開始抽籤，先搜尋附近餐廳再來玩吧！
        </div>
      </div>
    </div>

    <div class="small">
      小提醒：需要 HTTPS 網站 + 自己的 Google Maps API Key，地點資料由 Google 提供。
    </div>
  </div>

  <!-- 請把 YOUR_GOOGLE_MAPS_API_KEY 換成你自己的 key -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAzah5t1zIXY-Yg05uZKFYtVmlT4Pe0ZUQ&libraries=places"></script>
  <script>
    let userLocation = null;
    let allPlaces = [];
    let categoryMap = {}; // { categoryName: [place, place...] }

    const radiusInput = document.getElementById("radiusInput");
    const locateBtn = document.getElementById("locateBtn");
    const reshuffleBtn = document.getElementById("reshuffleBtn");
    const statusMsg = document.getElementById("statusMsg");
    const categoryList = document.getElementById("categoryList");
    const startRandomBtn = document.getElementById("startRandomBtn");
    const restaurantResult = document.getElementById("restaurantResult");

    locateBtn.addEventListener("click", () => {
      const radiusKm = Number(radiusInput.value) || 3;
      if (!navigator.geolocation) {
        statusMsg.textContent = "你的瀏覽器不支援定位功能。";
        return;
      }
      statusMsg.textContent = "正在取得你的位置…";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
          };
          statusMsg.textContent = `已取得位置，正在搜尋 ${radiusKm} 公里內餐廳…`;
          searchNearbyRestaurants(radiusKm);
        },
        (err) => {
          console.error(err);
          statusMsg.textContent = "無法取得位置，請確認瀏覽器有開啟定位權限。";
        }
      );
    });

    function searchNearbyRestaurants(radiusKm) {
      if (!userLocation) return;
      const service = new google.maps.places.PlacesService(
        document.createElement("div")
      );
      const request = {
        location: new google.maps.LatLng(userLocation.lat, userLocation.lng),
        radius: radiusKm * 1000,
        type: "restaurant",
      };

      allPlaces = [];
      categoryMap = {};
      categoryList.innerHTML = "";
      startRandomBtn.disabled = true;
      reshuffleBtn.disabled = true;

      service.nearbySearch(request, (results, status, pagination) => {
        if (status !== google.maps.places.PlacesServiceStatus.OK || !results) {
          statusMsg.textContent = "搜尋餐廳時發生錯誤，或是這一帶餐廳太少。";
          return;
        }
        allPlaces = allPlaces.concat(results);

        if (pagination && pagination.hasNextPage) {
          // Google 有分頁限制，這裡簡單示範再抓一次就好
          pagination.nextPage();
        } else {
          statusMsg.textContent = `找到 ${allPlaces.length} 家餐廳，請先選擇你有興趣的類型。`;
          buildCategoriesFromPlaces();
        }
      });
    }

    // 從 Places 的 types 萃出分類
    function buildCategoriesFromPlaces() {
      const ignoreTypes = new Set([
        "restaurant",
        "food",
        "point_of_interest",
        "establishment"
      ]);

      const tempMap = {};

      allPlaces.forEach((place) => {
        if (!place.types) return;
        place.types.forEach((t) => {
          if (ignoreTypes.has(t)) return;
          const label = mapTypeToLabel(t);
          if (!tempMap[label]) tempMap[label] = [];
          tempMap[label].push(place);
        });
      });

      // 如果某些店沒有任何特殊 type，就放到「其他」
      const otherLabel = "其他";
      allPlaces.forEach((place) => {
        const hasCategory = Object.values(tempMap).some((arr) =>
          arr.includes(place)
        );
        if (!hasCategory) {
          if (!tempMap[otherLabel]) tempMap[otherLabel] = [];
          tempMap[otherLabel].push(place);
        }
      });

      categoryMap = tempMap;
      renderCategoryCheckboxes();
    }

    function mapTypeToLabel(type) {
      // 可以自己再優化 mapping 規則
      const map = {
        cafe: "咖啡 / 輕食",
        bar: "酒吧 / 小酌",
        bakery: "麵包 / 甜點",
        meal_takeaway: "外帶 / 速食",
        meal_delivery: "外送為主",
      };
      if (map[type]) return map[type];
      // 沒特別 mapping 的，直接顯示英文 type
      return type;
    }

    function renderCategoryCheckboxes() {
      categoryList.innerHTML = "";
      const entries = Object.entries(categoryMap);
      if (entries.length === 0) {
        categoryList.textContent = "分類資訊不足，但你仍然可以直接抽全部餐廳。";
        startRandomBtn.disabled = false;
        reshuffleBtn.disabled = false;
        return;
      }
      entries.forEach(([label, places]) => {
        const id = "cat-" + label.replace(/\s+/g, "-");
        const wrapper = document.createElement("label");
        wrapper.className = "cat-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = label;
        checkbox.id = id;

        const span = document.createElement("span");
        span.textContent = `${label} (${places.length})`;

        wrapper.appendChild(checkbox);
        wrapper.appendChild(span);
        categoryList.appendChild(wrapper);
      });

      startRandomBtn.disabled = false;
      reshuffleBtn.disabled = false;
    }

    function getFilteredPlacesBySelectedCategories() {
      const checked = Array.from(
        categoryList.querySelectorAll("input[type=checkbox]:checked")
      ).map((c) => c.value);

      if (checked.length === 0) {
        // 沒選分類就用全部
        return allPlaces;
      }

      const set = new Set();
      checked.forEach((label) => {
        const arr = categoryMap[label] || [];
        arr.forEach((p) => set.add(p));
      });
      return Array.from(set);
    }

    function pickRandomRestaurant() {
      if (allPlaces.length === 0) {
        statusMsg.textContent = "還沒搜尋餐廳喔，先按「偵測我的位置並搜尋餐廳」。";
        return;
      }
      const candidates = getFilteredPlacesBySelectedCategories();
      if (candidates.length === 0) {
        restaurantResult.textContent = "這些分類底下沒有餐廳，換幾個分類試試看？";
        return;
      }
      const index = Math.floor(Math.random() * candidates.length);
      const place = candidates[index];
      renderRestaurant(place);
    }

    function renderRestaurant(place) {
      const name = place.name || "未命名餐廳";
      const addr = place.vicinity || place.formatted_address || "地址資訊不足";
      const rating = place.rating;
      const total = place.user_ratings_total;
      const phone = place.formatted_phone_number; // 這個通常要用 details API 才會有
      const website = place.website;
      const lat = place.geometry?.location?.lat();
      const lng = place.geometry?.location?.lng();

      const mapsLink = lat && lng
        ? `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`
        : null;

      restaurantResult.innerHTML = `
        <div class="restaurant-name">${name}</div>
        <div>${addr}</div>
        <div class="badge-row">
          ${
            rating
              ? `<span class="badge">⭐ ${rating.toFixed(1)} 分</span>`
              : ""
          }
          ${
            total
              ? `<span class="badge">🤝 ${total} 則評論</span>`
              : ""
          }
        </div>
        ${
          phone
            ? `<div>電話：<a href="tel:${phone}">${phone}</a></div>`
            : ""
        }
        ${
          website
            ? `<div>官方網站：<a href="${website}" target="_blank">前往官網</a></div>`
            : ""
        }
        ${
          mapsLink
            ? `<div>🗺 <a href="${mapsLink}" target="_blank">用 Google Maps 導航</a></div>`
            : ""
        }
        <div class="small">覺得不對味？按「再抽一次」試試看 😋</div>
      `;
    }

    startRandomBtn.addEventListener("click", pickRandomRestaurant);
    reshuffleBtn.addEventListener("click", pickRandomRestaurant);
  </script>
</body>
</html>
