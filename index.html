<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吃什麼轉盤</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    padding: 20px;
    background: #fafafa;
  }

  h1 {
    margin-bottom: 10px;
  }

  button {
    padding: 10px 14px;
    border: none;
    background: #4a8ef0;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled {
    background: #ccc;
  }

  .status {
    margin: 10px 0;
    color: #444;
  }

  .categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
  }

  .cat-item {
    background: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 13px;
    display: flex;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .cat-item input {
    margin: 0;
  }

  .random-controls {
    margin-top: 10px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .restaurant-card {
    background: #fff;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .restaurant-name {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .badge-row {
    margin: 6px 0;
    display: flex;
    gap: 6px;
  }

  .badge {
    background: #f0f0f0;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 12px;
  }

  iframe {
    margin-top: 6px;
  }
</style>
</head>

<body>

<h1>今天要吃什麼？🎲</h1>

<button id="detectBtn">偵測我的位置並搜尋餐廳</button>

<div class="status" id="statusMsg"></div>

<h3>分類（五大分類）</h3>
<div id="categoryList" class="categories"></div>

<div class="random-controls">
  <button id="startRandomBtn" disabled>開始抽籤 🎲</button>
  <button id="reshuffleBtn" disabled>再抽一次 🔄</button>

  <!-- ⭐ 新增：只顯示 4.0 分以上 -->
  <label style="font-size:12px;display:flex;align-items:center;gap:4px;">
    <input type="checkbox" id="ratingFilter" />
    只顯示 ⭐4.0 分以上
  </label>
</div>

<h3>抽籤結果</h3>
<div id="restaurantResult"></div>

<script>
// ====== 全域變數 ======
let userLocation = null;
let allPlaces = [];
let categoryMap = {};

const detectBtn = document.getElementById("detectBtn");
const statusMsg = document.getElementById("statusMsg");
const categoryList = document.getElementById("categoryList");
const startRandomBtn = document.getElementById("startRandomBtn");
const reshuffleBtn = document.getElementById("reshuffleBtn");
const restaurantResult = document.getElementById("restaurantResult");

// ====== 五大分類（含台灣飲料關鍵字） ======
const CATEGORY_RULES = [
  {
    key: "早餐",
    label: "早餐",
    keywords: ["早餐","早午餐","brunch","豆漿","永和豆漿","蛋餅","美而美","吐司","三明治","漢堡","早點"]
  },
  {
    key: "午餐",
    label: "午餐",
    keywords: ["便當","簡餐","定食","午餐","快餐","炒飯","炒麵","牛肉麵","麵館","自助餐","小吃","飯館"]
  },
  {
    key: "晚餐",
    label: "晚餐",
    keywords: ["晚餐","燒肉","火鍋","鍋物","居酒屋","燒烤","串燒","鐵板燒","熱炒","餐酒館","宵夜"]
  },
  {
    key: "下午茶",
    label: "下午茶",
    keywords: ["下午茶","甜點","蛋糕","鬆餅","司康","甜品","冰淇淋","冰品","patisserie","dessert"]
  },
  {
    key: "飲料",
    label: "飲料",
    keywords: [
      "飲料","手搖","手搖飲","奶茶","milk tea","tea","果汁","juice","smoothie",
      "五十嵐","50嵐","可不可","coco","清心","迷客夏","麥吉","茶湯會","圓石",
      "再睡5分鐘","先喝道","茶的魔手","一芳","大苑子","麻古","珍煮丹","春陽茶事","老虎堂","貢茶",
      "黑糖","鮮茶","烏弄","honey","萊爾富"
    ]
  }
];

// ====== 分類判斷 ======
function classifyPlace(place) {
  const name = (place.name || "") + " " + (place.vicinity || "") + " " + (place.formatted_address || "");
  const lower = name.toLowerCase();
  const matchedLabels = new Set();

  CATEGORY_RULES.forEach(rule => {
    const hit = rule.keywords.some(kw => lower.includes(kw.toLowerCase()));
    if (hit) matchedLabels.add(rule.label);
  });

  // Fallback：Place types
  if (matchedLabels.size === 0 && Array.isArray(place.types)) {
    const t = place.types.map(x => x.toLowerCase());
    if (t.includes("cafe")) matchedLabels.add("下午茶");
    if (t.includes("cafe")) matchedLabels.add("飲料");
    if (t.includes("bar")) matchedLabels.add("飲料");
    if (t.includes("bakery")) matchedLabels.add("下午茶");
    if (t.includes("meal_takeaway") || t.includes("meal_delivery")) {
      matchedLabels.add("午餐");
      matchedLabels.add("晚餐");
    }
    if (t.includes("restaurant") && matchedLabels.size === 0) {
      matchedLabels.add("午餐");
      matchedLabels.add("晚餐");
    }
  }

  if (matchedLabels.size === 0) {
    matchedLabels.add("午餐");
    matchedLabels.add("晚餐");
  }

  return Array.from(matchedLabels);
}

// ====== 建立分類清單 ======
function buildCategoriesFromPlaces() {
  categoryMap = {};
  CATEGORY_RULES.forEach(rule => categoryMap[rule.label] = []);

  allPlaces.forEach(place => {
    classifyPlace(place).forEach(label => {
      categoryMap[label].push(place);
    });
  });

  renderCategoryCheckboxes();
}

function renderCategoryCheckboxes() {
  categoryList.innerHTML = "";
  CATEGORY_RULES.forEach(rule => {
    const label = rule.label;
    const id = "cat-" + label;

    const wrapper = document.createElement("label");
    wrapper.className = "cat-item";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = label;
    checkbox.id = id;

    if (categoryMap[label].length === 0) checkbox.disabled = true;

    const span = document.createElement("span");
    span.textContent = `${label} (${categoryMap[label].length})`;

    wrapper.appendChild(checkbox);
    wrapper.appendChild(span);
    categoryList.appendChild(wrapper);
  });

  startRandomBtn.disabled = false;
  reshuffleBtn.disabled = false;
}

// ====== 取得候選 ======
function getFilteredPlacesBySelectedCategories() {
  const checked = Array.from(categoryList.querySelectorAll("input[type=checkbox]:checked"))
      .map(c => c.value);

  let candidates = [];

  if (checked.length === 0) {
    candidates = [...allPlaces];
  } else {
    const set = new Set();
    checked.forEach(label => {
      (categoryMap[label] || []).forEach(p => set.add(p));
    });
    candidates = Array.from(set);
  }

  // ⭐ 加上评分过滤
  const ratingFilter = document.getElementById("ratingFilter");
  if (ratingFilter.checked) {
    candidates = candidates.filter(p => p.rating >= 4.0);
  }

  return candidates;
}

// ====== 抽籤：抽 3 間 ======
function pickRandomRestaurant() {
  if (allPlaces.length === 0) {
    statusMsg.textContent = "請先搜尋餐廳！";
    return;
  }

  const candidates = getFilteredPlacesBySelectedCategories();
  if (candidates.length === 0) {
    restaurantResult.textContent = "找不到符合條件的餐廳，換別的分類看看？";
    return;
  }

  const shuffled = [...candidates].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(3, shuffled.length));

  renderRestaurantList(selected);
}

// ====== 顯示 3 間餐廳（含小地圖） ======
function renderRestaurantList(places) {
  restaurantResult.innerHTML = places.map(place => {
    const name = place.name || "未命名餐廳";
    const addr = place.vicinity || place.formatted_address || "沒有提供地址";
    const rating = place.rating;
    const total = place.user_ratings_total;

    const lat = place.geometry?.location?.lat();
    const lng = place.geometry?.location?.lng();

    const mapsLink = lat && lng
      ? `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`
      : null;

    const embedMap = lat && lng
      ? `
        <iframe
          width="100%"
          height="150"
          style="border-radius:12px;border:1px solid #ddd;margin-top:6px;"
          loading="lazy"
          src="https://www.google.com/maps/embed/v1/place?key=YOUR_GOOGLE_MAPS_API_KEY&q=${lat},${lng}">
        </iframe>`
      : "";

    return `
      <div class="restaurant-card">
        <div class="restaurant-name">${name}</div>
        <div>${addr}</div>

        <div class="badge-row">
          ${rating ? `<span class="badge">⭐ ${rating.toFixed(1)}</span>` : ""}
          ${total ? `<span class="badge">💬 ${total} 則評論</span>` : ""}
        </div>

        ${mapsLink ? `<div>🗺 <a href="${mapsLink}" target="_blank">導航到這裡</a></div>` : ""}
        ${embedMap}
      </div>
    `;
  }).join("") + `<div style="font-size:12px;color:#555;">不喜歡？按右邊的「再抽一次」🎲</div>`;
}

// ====== Google Maps Nearby 搜尋 ======
function searchNearbyRestaurants(radiusKm) {
  if (!userLocation) return;

  const service = new google.maps.places.PlacesService(document.createElement("div"));

  const request = {
    location: new google.maps.LatLng(userLocation.lat, userLocation.lng),
    radius: radiusKm * 1000,
    type: "restaurant"
  };

  allPlaces = [];
  categoryList.innerHTML = "";
  restaurantResult.innerHTML = "";
  startRandomBtn.disabled = true;
  reshuffleBtn.disabled = true;

  statusMsg.textContent = `正在搜尋 ${radiusKm} 公里內的餐廳…`;

  service.nearbySearch(request, (results, status) => {
    if (status !== google.maps.places.PlacesServiceStatus.OK || !results) {
      statusMsg.textContent = "搜尋失敗，可能附近沒有餐廳。";
      return;
    }

    allPlaces = results;
    statusMsg.textContent = `找到 ${results.length} 家餐廳，請選擇分類。`;
    buildCategoriesFromPlaces();
  });
}

// ====== 偵測位置 ======
detectBtn.addEventListener("click", () => {
  if (!navigator.geolocation) {
    alert("你的瀏覽器不支援定位");
    return;
  }

  statusMsg.textContent = "正在定位…";

  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    userLocation = { lat: latitude, lng: longitude };
    statusMsg.textContent = "已取得位置，開始搜尋餐廳…";
    searchNearbyRestaurants(5); // 預設搜尋 5 公里
  }, () => {
    statusMsg.textContent = "無法取得定位";
  });
});

startRandomBtn.addEventListener("click", pickRandomRestaurant);
reshuffleBtn.addEventListener("click", pickRandomRestaurant);
</script>

<!-- ⭐ Google Maps JS -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAzah5t1zIXY-Yg05uZKFYtVmlT4Pe0ZUQ&libraries=places"></script>

</body>
</html>
