<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吃什麼轉盤 v0.7.0</title>
  <style>
    :root {
      --bg: #050816;
      --bg-elevated: #0b1020;
      --bg-card: #111827;
      --bg-soft: #1f2937;
      --accent: #f472b6;     /* 粉色 */
      --accent-strong: #fb7185; /* 珊瑚粉 */
      --accent-soft: #4f46e5;   /* 靛藍 */
      --text-main: #e5e7eb;
      --text-sub: #9ca3af;
      --border-subtle: #1f2933;
      --danger: #fb7185;
      --radius-lg: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #4f46e5 0, transparent 45%),
        radial-gradient(circle at bottom right, #ec4899 0, transparent 45%),
        #020617;
      display: flex;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(145deg, #020617cc, #020617f2);
      border-radius: 32px;
      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.8),
        0 0 0 1px rgba(148, 163, 184, 0.35);
      padding: 16px 14px 12px;
      display: flex;
      flex-direction: column;
      min-height: 80vh;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-title span.logo-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 0%, #f9a8d4 0, #f97316 60%, #ec4899 100%);
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.8);
    }

    .app-subtitle {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .version-chip {
      background: radial-gradient(circle at 0 0, #4f46e5, #1e293b);
      border: 1px solid #6b21a8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: #e5e7eb;
      box-shadow: 0 0 12px rgba(129, 140, 248, 0.7);
    }

    .radius-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .radius-row label {
      font-size: 13px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
      background: #020617;
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid #111827;
    }

    input[type=number] {
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid #111827;
      font-size: 13px;
      width: 70px;
      outline: none;
      background: #020617;
      color: var(--text-main);
    }

    input[type=number]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(236, 72, 153, 0.6);
    }

    .btn {
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      background-image: radial-gradient(circle at 30% 0%, #f9a8d4, #fb7185);
      color: #f9fafb;
      box-shadow:
        0 6px 20px rgba(248, 113, 113, 0.6),
        0 0 0 1px rgba(248, 250, 252, 0.08);
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out,
        filter 0.08s ease-out;
    }

    .btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 3px 10px rgba(248, 113, 113, 0.5);
      filter: brightness(0.95);
    }

    .btn.secondary {
      background-image: linear-gradient(135deg, #111827, #020617);
      color: #e5e7eb;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.8);
    }

    .status {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-sub);
      min-height: 16px;
    }

    .card {
      margin-top: 12px;
      background: linear-gradient(145deg, #020617, #020617f2);
      border-radius: 20px;
      padding: 12px 12px 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.75);
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--text-sub);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .cat-item {
      background: #020617;
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
      display: flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      color: #e5e7eb;
    }

    .cat-item input {
      margin: 0;
    }

    .cat-item:hover {
      border-color: var(--accent);
    }

    /* --- 抽卡滑條（iOS 風格） --- */
    .slider-wrap {
      margin-top: 4px;
      text-align: center;
    }

    #cardCountRange {
      width: 80%;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #ec4899);
      outline: none;
    }

    #cardCountRange::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #020617;
      border: 3px solid #f472b6;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(236, 72, 153, 0.7);
    }

    #cardCountRange::-moz-range-thumb {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #020617;
      border: 3px solid #f472b6;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(236, 72, 153, 0.7);
    }

    #selectedCardCountLabel {
      font-size: 13px;
      margin-top: 6px;
      color: var(--text-main);
    }

    /* 抽出的卡片 */
    .restaurant-card {
      margin-bottom: 10px;
      padding: 10px 10px 8px;
      border-radius: 18px;
      background: radial-gradient(circle at 0 0, #111827, #020617);
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow:
        0 12px 24px rgba(15, 23, 42, 0.85),
        0 0 0 1px rgba(15, 23, 42, 0.7);
      animation: card-pop 0.25s ease-out;
    }

    @keyframes card-pop {
      from {
        transform: translateY(12px) scale(0.97);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .restaurant-name {
      font-size: 15px;
      font-weight: 600;
      color: #e5e7eb;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(248, 113, 113, 0.6);
      color: #fecaca;
      margin-left: 6px;
    }

    .restaurant-meta {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .restaurant-link a {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: #f9a8d4;
      text-decoration: none;
    }

    .restaurant-link a:hover {
      text-decoration: underline;
    }

    /* --- 多點 Google Map --- */
    #map {
      width: 100%;
      height: 220px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      overflow: hidden;
      background: #020617;
      margin-top: 8px;
    }

    #singleMapContainer-empty {
      font-size: 12px;
      color: var(--text-sub);
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: flex-end;
    }

    @media (max-width: 420px) {
      .app {
        padding-inline: 12px;
      }
      .footer-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .footer-actions .btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title-row">
      <div>
        <div class="app-title">
          <span class="logo-dot"></span> 吃什麼轉盤
        </div>
        <div class="app-subtitle">選類型 → 選距離 → 抽 1～3 張卡幫你決定</div>
      </div>
      <div class="version-chip">v0.7.0</div>
    </div>

    <div class="radius-row">
      <label>
        距離
        <input type="number" id="radiusInput" value="5" min="1" max="10" />
        公里內
      </label>
      <button class="btn" id="detectBtn">📍 定位並載入</button>
    </div>

    <div id="statusMsg" class="status"></div>

    <div class="card">
      <div class="card-title">
        <span>餐廳類型</span>
        <span class="card-subtitle">可複選，不選等於「全部都可以」</span>
      </div>
      <div id="categoryList" class="categories"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>抽卡數量</span>
        <span class="card-subtitle">最少 1 張，最多 3 張</span>
      </div>
      <div class="slider-wrap">
        <input id="cardCountRange" type="range" min="1" max="3" step="1" value="3" />
        <div id="selectedCardCountLabel">抽 3 張</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>抽到的餐廳</span>
        <span class="card-subtitle">按下開始抽籤，會顯示 1～3 張卡片</span>
      </div>
      <div id="restaurantResult">按「開始抽籤」開始 🎲</div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>地圖顯示</span>
        <span class="card-subtitle">地圖上會顯示本次抽到的所有店家</span>
      </div>
      <div id="singleMapContainer">
        <div id="singleMapContainer-empty">尚未有結果，抽到餐廳後會顯示地圖。</div>
        <div id="map" style="display:none;"></div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn secondary" id="startRandomBtn" disabled>開始抽籤 🎯</button>
      <button class="btn" id="reshuffleBtn" disabled>再抽一次 🔄</button>
    </div>
  </div>

  <!-- 把 YOUR_GOOGLE_MAPS_API_KEY 換成你的 Key -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAzah5t1zIXY-Yg05uZKFYtVmlT4Pe0ZUQ&libraries=places,geometry"></script>

  <script>
    // v0.7.0 JS — 深色 UI + 多點地圖

    let userLocation = null;
    let allPlaces = [];
    let drinkPlaces = null;
    const FETCH_RADIUS_KM = 10;
    const MAX_RESULTS = 60;

    const detectBtn = document.getElementById("detectBtn");
    const startRandomBtn = document.getElementById("startRandomBtn");
    const reshuffleBtn = document.getElementById("reshuffleBtn");
    const statusMsg = document.getElementById("statusMsg");
    const radiusInput = document.getElementById("radiusInput");
    const categoryList = document.getElementById("categoryList");
    const restaurantResult = document.getElementById("restaurantResult");
    const singleMapContainer = document.getElementById("singleMapContainer");
    const mapDiv = document.getElementById("map");
    const cardCountRange = document.getElementById("cardCountRange");
    const selectedCardCountLabel = document.getElementById("selectedCardCountLabel");

    let map = null;
    let mapMarkers = [];

    cardCountRange.addEventListener("input", () => {
      selectedCardCountLabel.textContent = `抽 ${cardCountRange.value} 張`;
    });

    document.addEventListener("DOMContentLoaded", () => {
      detectBtn.addEventListener("click", detectLocation);
      radiusInput.addEventListener("change", () => {
        restaurantResult.textContent = "距離已更新，請重新抽籤 🎲";
      });
      startRandomBtn.addEventListener("click", () => pickRandomRestaurant());
      reshuffleBtn.addEventListener("click", () => pickRandomRestaurant());
      buildCategoryCheckboxes();
    });

    function buildCategoryCheckboxes() {
      const cats = ["早餐", "午餐", "晚餐", "下午茶", "飲料"];
      categoryList.innerHTML = "";
      cats.forEach(c => {
        const id = "cat_" + c;
        const label = document.createElement("label");
        label.className = "cat-item";
        label.innerHTML = `
          <input type="checkbox" id="${id}" value="${c}" />
          <span>${c}</span>
        `;
        categoryList.appendChild(label);
      });
    }

    function detectLocation() {
      if (!navigator.geolocation) {
        statusMsg.textContent = "你的瀏覽器不支援定位功能。";
        return;
      }
      statusMsg.textContent = "正在取得你的位置…";

      navigator.geolocation.getCurrentPosition(
        pos => {
          userLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };
          statusMsg.textContent = "已取得位置，正在搜尋附近餐廳…";
          searchNearbyRestaurants();
        },
        err => {
          console.error(err);
          statusMsg.textContent = "無法取得定位，請確認已開啟定位權限。";
        }
      );
    }

    function searchNearbyRestaurants() {
      if (!userLocation) return;
      const service = new google.maps.places.PlacesService(document.createElement("div"));

      const request = {
        location: new google.maps.LatLng(userLocation.lat, userLocation.lng),
        rankBy: google.maps.places.RankBy.DISTANCE,
        type: "restaurant"
      };

      allPlaces = [];
      drinkPlaces = null;
      startRandomBtn.disabled = true;
      reshuffleBtn.disabled = true;
      restaurantResult.textContent = "正在載入附近餐廳…";

      service.nearbySearch(request, function handle(results, status, pagination) {
        if (status === google.maps.places.PlacesServiceStatus.OK && results) {
          const remaining = MAX_RESULTS - allPlaces.length;
          if (remaining > 0) {
            allPlaces = allPlaces.concat(results.slice(0, remaining));
          }
        }

        if (pagination && pagination.hasNextPage && allPlaces.length < MAX_RESULTS) {
          setTimeout(() => pagination.nextPage(), 350);
        } else {
          attachDistance(allPlaces);
          statusMsg.textContent = `已載入 ${allPlaces.length} 家餐廳，選好類型後即可抽籤。`;
          startRandomBtn.disabled = false;
          reshuffleBtn.disabled = false;
        }
      });
    }

    function attachDistance(list) {
      if (!userLocation || !google.maps.geometry) return;
      const origin = new google.maps.LatLng(userLocation.lat, userLocation.lng);
      list.forEach(p => {
        try {
          const distMeters = google.maps.geometry.spherical.computeDistanceBetween(
            origin,
            p.geometry.location
          );
          p._dist = distMeters / 1000;
        } catch (e) {
          p._dist = Infinity;
        }
      });
    }

    function getPlacesWithinRadius() {
      const r = Number(radiusInput.value) || 5;
      return allPlaces.filter(p => (p._dist ?? Infinity) <= r);
    }

    async function fetchDrinkPlacesIfNeeded() {
      if (drinkPlaces !== null) return drinkPlaces;
      if (!userLocation) return [];

      const service = new google.maps.places.PlacesService(document.createElement("div"));
      const request = {
        location: new google.maps.LatLng(userLocation.lat, userLocation.lng),
        radius: FETCH_RADIUS_KM * 1000,
        keyword: "飲料 手搖 手搖飲 奶茶 咖啡 coffee tea 紅茶 綠茶 珍珠"
      };

      drinkPlaces = [];

      return new Promise(resolve => {
        service.nearbySearch(request, function handle(results, status, pagination) {
          if (status === google.maps.places.PlacesServiceStatus.OK && results) {
            drinkPlaces = drinkPlaces.concat(results);
          }
          if (pagination && pagination.hasNextPage && drinkPlaces.length < MAX_RESULTS) {
            setTimeout(() => pagination.nextPage(), 350);
          } else {
            attachDistance(drinkPlaces);
            resolve(drinkPlaces);
          }
        });
      });
    }

    function classifyPlaceLabels(place) {
      const text =
        (place.name || "") +
        " " +
        (place.vicinity || "") +
        " " +
        (place.formatted_address || "");
      const labels = [];

      if (/早餐|早午餐|brunch|豆漿|蛋餅|吐司|三明治|美而美|早點/i.test(text)) {
        labels.push("早餐");
      }

      if (/下午茶|甜點|蛋糕|鬆餅|司康|冰淇淋|冰品|dessert/i.test(text)) {
        labels.push("下午茶");
      }

      if (/飲料|手搖|手搖飲|奶茶|紅茶|綠茶|茶坊|cafe|coffee|咖啡|果汁|smoothie|冰沙/i.test(text)) {
        labels.push("飲料");
      }

      if (labels.length === 0) {
        labels.push("午餐", "晚餐");
      }

      return labels;
    }

    async function pickRandomRestaurant() {
      if (!userLocation || !allPlaces.length) {
        restaurantResult.textContent = "請先按「定位並載入」取得附近餐廳。";
        return;
      }

      const selectedCats = Array.from(
        categoryList.querySelectorAll("input[type=checkbox]:checked")
      ).map(i => i.value);

      if (!selectedCats.length) {
        restaurantResult.textContent = "請至少選擇 1 種餐廳類型。";
        clearMap();
        return;
      }

      const within = getPlacesWithinRadius();
      const poolMap = new Map();
      const radiusKm = Number(radiusInput.value) || 5;
      const nonDrinkCats = selectedCats.filter(c => c !== "飲料");

      within.forEach(p => {
        const labels = classifyPlaceLabels(p);
        if (nonDrinkCats.length > 0) {
          if (!labels.some(l => nonDrinkCats.includes(l))) return;
        } else {
          // 只有飲料類時，主餐暫時不加入
          return;
        }
        if (!poolMap.has(p.place_id)) {
          poolMap.set(p.place_id, p);
        }
      });

      if (selectedCats.includes("飲料")) {
        const drinks = await fetchDrinkPlacesIfNeeded();
        const filteredDrinks = drinks.filter(p => (p._dist ?? Infinity) <= radiusKm);
        filteredDrinks.forEach(p => {
          p._isDrink = true;
          if (!poolMap.has(p.place_id)) {
            poolMap.set(p.place_id, p);
          }
        });

        within.forEach(p => {
          const labels = classifyPlaceLabels(p);
          if (labels.includes("飲料") && !poolMap.has(p.place_id)) {
            p._isDrink = true;
            poolMap.set(p.place_id, p);
          }
        });
      }

      const pool = Array.from(poolMap.values());

      if (!pool.length) {
        restaurantResult.textContent =
          "這個距離與條件下暫時找不到店家，試著放寬距離看看 🍽️";
        clearMap();
        return;
      }

      pool.sort((a, b) => (a._dist ?? Infinity) - (b._dist ?? Infinity));
      pool.sort(() => Math.random() - 0.5);

      const count = Number(cardCountRange.value) || 1;
      const finalCount = Math.min(count, pool.length);
      const selected = pool.slice(0, finalCount);

      renderCards(selected);
      renderMapForPlaces(selected);
    }

    function renderCards(list) {
      restaurantResult.innerHTML = list
        .map(p => {
          const dist = (p._dist ?? 0).toFixed(2);
          const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
            p.name
          )}&query_place_id=${p.place_id || ""}`;
          const drinkTag = p._isDrink
            ? '<span class="tag-pill">🧋 飲料</span>'
            : "";
          return `
          <div class="restaurant-card">
            <div class="restaurant-name">
              ${p.name || "未命名餐廳"} ${drinkTag}
            </div>
            <div class="restaurant-meta">
              距離：約 ${dist} km
            </div>
            <div class="restaurant-link">
              <a href="${mapsUrl}" target="_blank">➡ 打開 Google 地圖導航</a>
            </div>
          </div>
        `;
        })
        .join("");
    }

    function ensureMap() {
      if (!map) {
        map = new google.maps.Map(mapDiv, {
          center: userLocation
            ? { lat: userLocation.lat, lng: userLocation.lng }
            : { lat: 25.033, lng: 121.5654 },
          zoom: 15,
          disableDefaultUI: true,
          styles: [
            { elementType: "geometry", stylers: [{ color: "#0b1120" }] },
            { elementType: "labels.text.fill", stylers: [{ color: "#e5e7eb" }] },
            { elementType: "labels.text.stroke", stylers: [{ color: "#020617" }] },
            {
              featureType: "poi",
              elementType: "geometry",
              stylers: [{ color: "#020617" }]
            },
            {
              featureType: "poi.park",
              elementType: "geometry",
              stylers: [{ color: "#022c22" }]
            },
            {
              featureType: "road",
              elementType: "geometry",
              stylers: [{ color: "#111827" }]
            },
            {
              featureType: "water",
              elementType: "geometry",
              stylers: [{ color: "#0b1120" }]
            }
          ]
        });
      }
    }

    function clearMap() {
      if (!mapMarkers.length) {
        mapDiv.style.display = "none";
        document.getElementById("singleMapContainer-empty").style.display =
          "block";
        return;
      }
      mapMarkers.forEach(m => m.setMap(null));
      mapMarkers = [];
      mapDiv.style.display = "none";
      document.getElementById("singleMapContainer-empty").style.display =
        "block";
    }

    function renderMapForPlaces(list) {
      if (!list.length) {
        clearMap();
        return;
      }
      ensureMap();

      // 清掉舊 marker
      mapMarkers.forEach(m => m.setMap(null));
      mapMarkers = [];

      const bounds = new google.maps.LatLngBounds();

      list.forEach(p => {
        if (!p.geometry || !p.geometry.location) return;
        const loc = p.geometry.location;
        const marker = new google.maps.Marker({
          position: loc,
          map,
          title: p.name || ""
        });
        mapMarkers.push(marker);
        bounds.extend(loc);
      });

      if (!mapMarkers.length) {
        clearMap();
        return;
      }

      document.getElementById("singleMapContainer-empty").style.display =
        "none";
      mapDiv.style.display = "block";
      map.fitBounds(bounds);
    }
  </script>
</body>
</html>
