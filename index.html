<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>像素風小小 RPG</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #37474f 0, #111 60%, #000 100%);
      color: #f5f5f5;
    }

    .frame {
      background: #050608;
      border-radius: 18px;
      border: 2px solid #263238;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      padding: 14px 16px 16px;
      max-width: 860px;
      width: 100%;
    }

    .frame-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .game-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.7;
    }

    .hearts {
      font-size: 18px;
      letter-spacing: 2px;
    }

    .game-container {
      display: flex;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .game-container {
        flex-direction: column;
        align-items: center;
      }
      .frame {
        padding: 12px;
      }
    }

    .canvas-wrap {
      padding: 10px;
      border-radius: 14px;
      background: linear-gradient(145deg, #263238, #11161a);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    canvas {
      image-rendering: pixelated; /* 讓格子感更明顯 */
      border-radius: 8px;
      display: block;
    }

    .sidebar {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel {
      border-radius: 12px;
      padding: 10px 12px;
      background: linear-gradient(145deg, #16171b, #08090c);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.7);
    }

    .panel h2 {
      font-size: 13px;
      margin: 0 0 6px 0;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #b0bec5;
    }

    #status {
      font-size: 13px;
      line-height: 1.6;
    }

    #log {
      height: 190px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.4;
      padding-right: 4px;
    }

    #log div { margin-bottom: 3px; }

    .hint {
      font-size: 11px;
      color: #90a4ae;
      margin-top: 4px;
    }

    .bold { font-weight: 600; color: #fff9c4; }

    .footer-hint {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.7;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="frame-header">
      <div class="title-wrap">
        <div class="game-title">像素風小小 RPG</div>
        <div class="subtitle">使用 W / A / S / D 或 方向鍵移動角色</div>
      </div>
      <div class="hearts" id="hearts"></div>
    </div>

    <div class="game-container">
      <div class="canvas-wrap">
        <!-- 10 x 10 格，每格 32px -->
        <canvas id="gameCanvas" width="320" height="320"></canvas>
      </div>

      <div class="sidebar">
        <div class="panel">
          <h2>狀態 Status</h2>
          <div id="status"></div>
        </div>
        <div class="panel">
          <h2>事件紀錄 Log</h2>
          <div id="log"></div>
          <div class="hint">靠近藍色格子（NPC）與紅色格子（怪物）試試看。</div>
        </div>
      </div>
    </div>

    <div class="footer-hint">這是 2D 像素格子版，之後可以再換成真正圖檔素材。</div>
  </div>

  <script>
    // 地圖圖例：
    // 0 = 草地, 1 = 牆, 2 = NPC, 3 = 怪物格, 4 = 水
    const tileSize = 32;
    const mapData = [
      [4,4,4,4,4,4,4,4,4,4],
      [4,0,0,0,0,0,0,0,3,4],
      [4,0,0,1,1,0,0,0,0,4],
      [4,0,0,0,1,0,2,0,0,4],
      [4,0,1,0,1,0,0,0,0,4],
      [4,0,1,0,0,0,0,1,0,4],
      [4,0,0,0,0,1,0,0,0,4],
      [4,0,0,1,0,0,0,0,0,4],
      [4,3,0,0,0,0,0,0,0,4],
      [4,4,4,4,4,4,4,4,4,4]
    ];

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const heartsEl = document.getElementById("hearts");

    const player = {
      x: 1,
      y: 1,
      hp: 20,
      maxHp: 20,
      attack: 5,
      level: 1,
      exp: 0
    };

    let npcMet = false;

    function drawTile(x, y, type) {
      const px = x * tileSize;
      const py = y * tileSize;

      if (type === 0) {
        // 草地
        const grad = ctx.createLinearGradient(px, py, px + tileSize, py + tileSize);
        grad.addColorStop(0, "#1b5e20");
        grad.addColorStop(1, "#4caf50");
        ctx.fillStyle = grad;
      } else if (type === 1) {
        // 牆
        const grad = ctx.createLinearGradient(px, py, px + tileSize, py + tileSize);
        grad.addColorStop(0, "#424242");
        grad.addColorStop(1, "#212121");
        ctx.fillStyle = grad;
      } else if (type === 2) {
        // NPC 地板
        const grad = ctx.createLinearGradient(px, py, px + tileSize, py + tileSize);
        grad.addColorStop(0, "#0d47a1");
        grad.addColorStop(1, "#1976d2");
        ctx.fillStyle = grad;
      } else if (type === 3) {
        // 怪物地板
        const grad = ctx.createLinearGradient(px, py, px + tileSize, py + tileSize);
        grad.addColorStop(0, "#b71c1c");
        grad.addColorStop(1, "#7f0000");
        ctx.fillStyle = grad;
      } else if (type === 4) {
        // 水
        const grad = ctx.createLinearGradient(px, py, px, py + tileSize);
        grad.addColorStop(0, "#01579b");
        grad.addColorStop(1, "#0288d1");
        ctx.fillStyle = grad;
      }

      ctx.fillRect(px, py, tileSize, tileSize);

      // 邊框讓像素感更明顯
      ctx.strokeStyle = "rgba(0,0,0,0.45)";
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, tileSize - 1, tileSize - 1);
    }

    function renderMap() {
      for (let y = 0; y < mapData.length; y++) {
        for (let x = 0; x < mapData[0].length; x++) {
          drawTile(x, y, mapData[y][x]);
        }
      }

      // 畫玩家（小人頭）
      const px = player.x * tileSize + tileSize / 2;
      const py = player.y * tileSize + tileSize / 2;

      // 身體
      ctx.fillStyle = "#1565c0";
      ctx.beginPath();
      ctx.roundRect(px - 8, py - 4, 16, 16, 4);
      ctx.fill();

      // 頭
      ctx.fillStyle = "#ffe082";
      ctx.beginPath();
      ctx.arc(px, py - 10, 8, 0, Math.PI * 2);
      ctx.fill();

      // 眼睛
      ctx.fillStyle = "#263238";
      ctx.fillRect(px - 4, py - 12, 2, 2);
      ctx.fillRect(px + 2, py - 12, 2, 2);
    }

    function updateStatus() {
      statusEl.innerHTML = `
        等級：<span class="bold">${player.level}</span><br>
        HP：<span class="bold">${player.hp}</span> / ${player.maxHp}<br>
        攻擊力：<span class="bold">${player.attack}</span><br>
        經驗值：<span class="bold">${player.exp}</span>
      `;

      const heartsTotal = Math.ceil(player.maxHp / 5);
      const heartsFilled = Math.ceil(player.hp / 5);
      let heartsStr = "";
      for (let i = 0; i < heartsTotal; i++) {
        heartsStr += i < heartsFilled ? "❤️" : "🤍";
      }
      heartsEl.textContent = heartsStr;
    }

    function addLog(text) {
      const line = document.createElement("div");
      line.textContent = text;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function canMoveTo(x, y) {
      if (y < 0 || y >= mapData.length) return false;
      if (x < 0 || x >= mapData[0].length) return false;
      const tile = mapData[y][x];
      // 水和牆不能走
      if (tile === 1 || tile === 4) return false;
      return true;
    }

    function movePlayer(dx, dy) {
      const newX = player.x + dx;
      const newY = player.y + dy;

      if (!canMoveTo(newX, newY)) {
        addLog("那邊走不過去。");
        return;
      }

      player.x = newX;
      player.y = newY;

      const tileType = mapData[newY][newX];
      if (tileType === 2) {
        triggerNpc();
      } else if (tileType === 3) {
        triggerMonster();
      }

      renderMap();
      updateStatus();
    }

    function triggerNpc() {
      if (!npcMet) {
        addLog("神秘 NPC：『歡迎來到像素小島，巡櫃勇者。』");
        addLog("神秘 NPC：『現場看到的，比報表更誠實喔。』");
        npcMet = true;
      } else {
        addLog("NPC：『今天的動線和人潮，有沒有什麼新發現？』");
      }
    }

    function triggerMonster() {
      addLog("你遇到了一隻怪物！開始戰鬥！");
      let monsterHp = 10;
      const monsterAttack = 3;

      while (monsterHp > 0 && player.hp > 0) {
        monsterHp -= player.attack;
        addLog(`你對怪物造成 ${player.attack} 點傷害。怪物 HP：${Math.max(monsterHp, 0)}`);
        if (monsterHp <= 0) break;

        player.hp -= monsterAttack;
        addLog(`怪物攻擊了你，你受到 ${monsterAttack} 點傷害。你的 HP：${Math.max(player.hp, 0)}`);
      }

      if (player.hp <= 0) {
        addLog("你倒下了……重新整理頁面可以再來一次。");
      } else {
        addLog("你打倒了怪物！獲得 5 點經驗值。");
        player.exp += 5;
        if (player.exp >= 10 && player.level === 1) {
          player.level = 2;
          player.maxHp += 5;
          player.hp = player.maxHp;
          player.attack += 2;
          addLog("你升級了！等級 2，攻擊與 HP 提升。");
        }
        // 打過的怪物格改成草地
        mapData[player.y][player.x] = 0;
      }
    }

    function handleKey(e) {
      const key = e.key.toLowerCase();
      if (key === "arrowup" || key === "w") movePlayer(0, -1);
      else if (key === "arrowdown" || key === "s") movePlayer(0, 1);
      else if (key === "arrowleft" || key === "a") movePlayer(-1, 0);
      else if (key === "arrowright" || key === "d") movePlayer(1, 0);
    }

    // 初始化
    renderMap();
    updateStatus();
    addLog("歡迎來到像素風小小 RPG 世界！");
    addLog("使用 W / A / S / D 或方向鍵移動角色。");

    window.addEventListener("keydown", handleKey);
  </script>
</body>
</html>
