<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吃什麼轉盤 (精準省錢版)</title>
  <style>
    :root {
      --primary: #00bfa5;
      --primary-dark: #009688;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-subtle: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      background: radial-gradient(circle at top, #e0f7fa 0, #e2f3ff 40%, #f8fafc 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
      padding: 12px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: #ffffffee;
      border-radius: 24px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.22),
        0 0 0 1px rgba(148, 163, 184, 0.25);
      display: flex;
      flex-direction: column;
      padding: 12px 14px 8px;
    }

    .app-header {
      padding: 4px 4px 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .title-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 700;
    }

    .app-subtitle {
      font-size: 12px;
      color: var(--text-sub);
    }

    .chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #ecfeff;
      border: 1px solid #a5f3fc;
      color: #0f766e;
    }

    .version-chip {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
    }

    .radius-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .radius-row label {
      font-size: 13px;
      color: var(--text-sub);
    }

    #radiusInput {
      width: 72px;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      outline: none;
    }

    #radiusInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(0, 191, 165, 0.3);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 191, 165, 0.45);
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 6px rgba(0, 191, 165, 0.4);
    }

    .btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn.secondary {
      background: #e2e8f0;
      color: #0f172a;
      box-shadow: none;
    }

    .btn.secondary:active {
      box-shadow: 0 2px 6px rgba(148, 163, 184, 0.4);
    }

    .btn.tiny {
      padding: 4px 10px;
      font-size: 11px;
      box-shadow: none;
    }

    .status {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-sub);
      min-height: 18px;
    }

    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 2px 4px;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--text-sub);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .cat-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 12px;
      cursor: pointer;
    }

    .cat-item input { margin: 0; }

    .results-empty {
      font-size: 13px;
      color: var(--text-sub);
    }

    .card-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .restaurant-card {
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 10px 10px 8px;
      box-shadow: 0 8px 18px rgba(148, 163, 184, 0.25);
      transform: translateY(16px) scale(0.96);
      opacity: 0;
      animation: card-pop 0.28s ease-out forwards;
    }

    .restaurant-card:nth-child(1) { animation-delay: 0.0s; }
    .restaurant-card:nth-child(2) { animation-delay: 0.08s; }
    .restaurant-card:nth-child(3) { animation-delay: 0.16s; }

    @keyframes card-pop {
      from { transform: translateY(16px) scale(0.96); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    .restaurant-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .restaurant-addr {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .badge {
      padding: 2px 6px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0f172a;
    }

    .open-now {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .open-now.ok { color: #0f766e; }
    .open-now.closed { color: #b91c1c; }

    .map-link {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .map-link a {
      color: var(--primary-dark);
      text-decoration: none;
    }

    .map-link a:hover { text-decoration: underline; }

    iframe {
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      width: 100%;
      height: 140px;
      margin-top: 4px;
    }

    .hint-footer {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .app-footer {
      border-top: 1px solid var(--border-subtle);
      padding: 6px 4px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .footer-left label {
      font-size: 11px;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer-right {
      display: flex;
      gap: 6px;
    }

    .footer-right .btn { padding-inline: 12px; }

    /* Debug list styles */
    .debug-list {
      margin-top: 6px;
      font-size: 11px;
      max-height: 220px;
      overflow-y: auto;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 6px 8px;
      display: none; /* 預設隱藏 */
    }

    .debug-item {
      border-bottom: 1px solid #e2e8f0;
      padding: 4px 0;
    }

    .debug-item:last-child {
      border-bottom: none;
    }

    .debug-line-1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .debug-name {
      font-weight: 600;
      font-size: 11px;
    }

    .debug-meta {
      font-size: 10px;
      color: #64748b;
    }

    .debug-tags {
      font-size: 10px;
      color: #0f766e;
      margin-top: 2px;
    }

    .debug-empty {
      font-size: 11px;
      color: #94a3b8;
    }

    @media (max-width: 400px) {
      .radius-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .app { padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="title-row">
        <div class="title-left">
          <div class="app-title">吃什麼轉盤 🍽️</div>
          <div class="app-subtitle">精準搜尋附近美食/小吃/飲料</div>
        </div>
        <div class="title-right">
          <div class="chip">解決選擇困難</div>
          <div class="chip version-chip">省錢版 v1.0</div>
        </div>
      </div>
      <div class="radius-row">
        <label>
          搜尋半徑：
          <input id="radiusInput" type="number" min="0.5" max="5" step="0.5" value="1" /> km
        </label>
        <button id="detectBtn" class="btn">📍 定位並搜尋</button>
      </div>
      <div id="statusMsg" class="status"></div>
    </header>

    <main class="app-main">
      <section class="card">
        <div class="card-title-row">
          <div>
            <div class="card-title">選擇類型</div>
            <div class="card-subtitle" id="categorySubtitle">
              先按「定位」搜尋，再勾選想吃的種類
            </div>
          </div>
        </div>
        <div id="categoryList" class="categories"></div>
      </section>

      <section class="card">
        <div class="card-title-row">
          <div class="card-title">抽到的選項（最多 3 間）</div>
          <div class="card-subtitle">卡牌抽籤，每次不同組合</div>
        </div>
        <div id="restaurantResult" class="results-empty">
          尚未開始，請先按上方「定位並搜尋」🔍
        </div>
      </section>

      <section class="card">
        <div class="card-title-row">
          <div>
            <div class="card-title">資料總覽 (Debug)</div>
            <div class="card-subtitle">
              查看搜尋回來的原始清單
            </div>
          </div>
          <button id="toggleDebugBtn" class="btn secondary tiny">顯示 / 隱藏</button>
        </div>
        <div id="debugList" class="debug-list"></div>
      </section>
    </main>

    <footer class="app-footer">
      <div class="footer-left">
        <label>
          <input type="checkbox" id="ratingFilter" checked />
          只顯示 ⭐4.0 以上
        </label>
      </div>
      <div class="footer-right">
        <button id="startRandomBtn" class="btn secondary" disabled>開始抽籤 🎯</button>
        <button id="reshuffleBtn" class="btn" disabled>再抽一次 🔄</button>
      </div>
    </footer>
  </div>

  <script>
    // ---- 設定與全域變數 ----
    // 省錢策略：使用兩組關鍵字，且不自動翻頁 (每點一次消耗 2 個 API Request)
    const SEARCH_QUERIES = [
      { keyword: '美食', type: 'restaurant' }, // 涵蓋餐廳、小吃
      { keyword: '飲料', type: 'cafe' }        // 涵蓋手搖、咖啡
    ];

    let userLocation = null;
    let allPlaces = [];      // 搜尋回來的原始資料
    let categoryMap = {};    // 分類後的資料
    let placesService = null;

    // 五大分類規則 (分類時使用)
    const CATEGORY_RULES = [
      {
        label: "早餐",
        keywords: ["早餐","早午餐","brunch","豆漿","蛋餅","吐司","三明治","漢堡"]
      },
      {
        label: "午餐",
        keywords: ["便當","簡餐","定食","午餐","飯","麵","小吃","餃子"]
      },
      {
        label: "晚餐",
        keywords: ["晚餐","燒肉","火鍋","居酒屋","燒烤","熱炒","餐酒館"]
      },
      {
        label: "下午茶",
        keywords: ["下午茶","甜點","蛋糕","鬆餅","甜品","冰","豆花","咖啡","cafe","coffee"]
      },
      {
        label: "飲料",
        keywords: ["飲料","手搖","奶茶","紅茶","綠茶","果汁","茶","tea","bubble","喝"]
      }
    ];

    // 計算兩點距離（公尺）
    function computeDistanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 排序：依距離由近到遠
    function attachDistanceAndSort(list) {
      if (!userLocation) return;
      list.forEach(p => {
        const lat = p.geometry?.location?.lat();
        const lng = p.geometry?.location?.lng();
        if (typeof lat === "number" && typeof lng === "number") {
          p._distanceMeters = computeDistanceMeters(userLocation.lat, userLocation.lng, lat, lng);
        } else {
          p._distanceMeters = Infinity;
        }
      });
      list.sort((a, b) => (a._distanceMeters || 0) - (b._distanceMeters || 0));
    }

    // 智慧分類：依照店名、關鍵字與來源進行分類
    function classifyPlace(place) {
      const labels = new Set();
      const text = (place.name || "") + " " + (place.vicinity || "") + " " + (place.types || []).join(" ");
      const lower = text.toLowerCase();

      // 1. 如果是飲料搜尋來的，或者名字/類型包含飲料關鍵字
      if (place._searchKeyword === '飲料') labels.add("飲料");
      
      // 2. 依照規則跑一次
      CATEGORY_RULES.forEach(rule => {
        const hit = rule.keywords.some(kw => lower.includes(kw.toLowerCase()));
        if (hit) labels.add(rule.label);
      });

      // 3. 補強：便利商店通常排除，或可自行決定
      if (lower.includes("7-eleven") || lower.includes("全家") || lower.includes("convenience_store")) {
         // labels.clear(); // 若不想抽到便利商店，可取消註解
      }

      // 預設值：如果都不是，就當午晚餐
      if (labels.size === 0) {
        labels.add("午餐");
        labels.add("晚餐");
      }

      return Array.from(labels);
    }

    // 重新建立 Category Map
    function rebuildCategoryMap(categorySubtitle) {
      categoryMap = {};
      CATEGORY_RULES.forEach(rule => { categoryMap[rule.label] = []; });

      let count = 0;
      allPlaces.forEach(place => {
        const labels = classifyPlace(place);
        place._labels = labels; // 存回去給 Debug 看
        
        labels.forEach(label => {
          if (!categoryMap[label]) categoryMap[label] = [];
          categoryMap[label].push(place);
        });
        count++;
      });

      if (categorySubtitle) {
        categorySubtitle.textContent = `已載入 ${count} 間店家，請選擇分類`;
      }
    }

    // 渲染分類勾選框
    function renderCategoryCheckboxes(categoryList, startRandomBtn, reshuffleBtn) {
      categoryList.innerHTML = "";
      CATEGORY_RULES.forEach(rule => {
        const label = rule.label;
        const count = (categoryMap[label] || []).length;

        const wrapper = document.createElement("label");
        wrapper.className = "cat-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = label;
        // 預設全選，如果沒資料就 disable
        checkbox.checked = count > 0;
        if (count === 0) checkbox.disabled = true;

        const span = document.createElement("span");
        span.textContent = `${label} (${count})`;

        wrapper.appendChild(checkbox);
        wrapper.appendChild(span);
        categoryList.appendChild(wrapper);
      });

      startRandomBtn.disabled = false;
      reshuffleBtn.disabled = false;
    }

    // 渲染 Debug 列表
    function renderDebugList(debugListEl) {
      if (!allPlaces.length) {
        debugListEl.innerHTML = '<div class="debug-empty">無資料</div>';
        return;
      }
      const rows = allPlaces.map((p, idx) => {
        const dist = p._distanceMeters ? (p._distanceMeters / 1000).toFixed(2) + 'km' : '?';
        const labels = (p._labels || []).join(" / ");
        return `
          <div class="debug-item">
            <div class="debug-line-1">
              <div class="debug-name">${idx + 1}. ${p.name}</div>
              <div class="debug-meta">${dist} | ⭐${p.rating || '-'}</div>
            </div>
            <div class="debug-tags">${labels}</div>
          </div>
        `;
      }).join("");
      debugListEl.innerHTML = rows;
    }

    // ---- 核心：搜尋函式 (改版) ----
    function searchNearbyRestaurants(statusMsg, categoryList, restaurantResult, categorySubtitle, startRandomBtn, reshuffleBtn, radiusInput, debugListEl) {
      if (!userLocation) return;
      if (!placesService) {
        placesService = new google.maps.places.PlacesService(document.createElement("div"));
      }

      // 取得半徑 (防呆：最小 500 公尺)
      let r = parseFloat(radiusInput.value);
      if (isNaN(r) || r < 0.1) r = 1;
      const radiusMeters = Math.max(r * 1000, 500);

      statusMsg.textContent = `搜尋半徑：${(radiusMeters/1000).toFixed(1)} km，搜尋中...`;
      restaurantResult.innerHTML = "正在多路搜尋美食與飲料...";
      debugListEl.innerHTML = "搜尋中...";
      startRandomBtn.disabled = true;
      reshuffleBtn.disabled = true;
      categoryList.innerHTML = "";

      // 建立多個 Promise 並行搜尋
      const promises = SEARCH_QUERIES.map(query => {
        return new Promise((resolve) => {
          const request = {
            location: new google.maps.LatLng(userLocation.lat, userLocation.lng),
            radius: radiusMeters,
            keyword: query.keyword // 關鍵：用 keyword 搜比較準
          };

          placesService.nearbySearch(request, (results, status) => {
            if (status === google.maps.places.PlacesServiceStatus.OK && results) {
              // 標記來源
              results.forEach(p => { p._searchKeyword = query.keyword; });
              // ⚠️ 省錢重點：直接 resolve 第一頁結果，不呼叫 nextPage()
              resolve(results);
            } else {
              resolve([]);
            }
          });
        });
      });

      Promise.all(promises).then(resultsArrays => {
        // 合併並去重
        const mergedMap = new Map();
        resultsArrays.flat().forEach(p => {
          if (p.place_id && !mergedMap.has(p.place_id)) {
             mergedMap.set(p.place_id, p);
          }
        });

        allPlaces = Array.from(mergedMap.values());
        attachDistanceAndSort(allPlaces);

        statusMsg.textContent = `搜尋完成，共找到 ${allPlaces.length} 間店家。`;
        
        rebuildCategoryMap(categorySubtitle);
        renderCategoryCheckboxes(categoryList, startRandomBtn, reshuffleBtn);
        renderDebugList(debugListEl);

        if (allPlaces.length === 0) {
          restaurantResult.innerHTML = "範圍內找不到店家，請試著增加距離 (km)。";
        } else {
          restaurantResult.innerHTML = "資料準備就緒，請按「開始抽籤」！🎯";
        }
      });
    }

    // 抽籤邏輯
    function pickRandomRestaurant(categoryList, restaurantResult, ratingFilter) {
      if (!allPlaces.length) return;

      // 1. 取得勾選的分類
      const checkedValues = Array.from(categoryList.querySelectorAll("input:checked")).map(x => x.value);
      if (checkedValues.length === 0) {
        restaurantResult.textContent = "請至少勾選一種分類！";
        return;
      }

      // 2. 篩選候選名單
      const candidatesSet = new Set();
      checkedValues.forEach(label => {
        (categoryMap[label] || []).forEach(p => candidatesSet.add(p));
      });
      let candidates = Array.from(candidatesSet);

      // 3. 篩選評分
      if (ratingFilter.checked) {
        candidates = candidates.filter(p => (p.rating || 0) >= 4.0);
      }

      if (candidates.length === 0) {
        restaurantResult.textContent = "條件過濾後沒有餐廳了，試著取消「⭐4.0以上」或增加距離。";
        return;
      }

      // 4. 隨機取 3 間
      const shuffled = candidates.sort(() => Math.random() - 0.5);
      const selected = shuffled.slice(0, 3);

      renderRestaurantList(selected, restaurantResult);
    }

    // 渲染卡片
    function renderRestaurantList(places, restaurantResult) {
      const html = places.map(place => {
        const name = place.name;
        const addr = place.vicinity || "地址未提供";
        const rating = place.rating ? place.rating.toFixed(1) : "無";
        const total = place.user_ratings_total || 0;
        const dist = place._distanceMeters ? (place._distanceMeters / 1000).toFixed(1) : "-";
        const lat = place.geometry?.location?.lat();
        const lng = place.geometry?.location?.lng();
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}&query_place_id=${place.place_id}`;

        // 簡單的 iframe 地圖 (注意：大量使用 iframe 也有額度限制，這裡僅示範)
        // 若要更省錢，可以拿掉 iframe，只留連結
        const mapEmbed = `
          <iframe 
            src="https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed" 
            frameborder="0" style="border:0" allowfullscreen loading="lazy">
          </iframe>`;

        return `
          <div class="restaurant-card">
            <div class="restaurant-name">${name}</div>
            <div class="restaurant-addr">${addr}</div>
            <div class="badge-row">
               <span class="badge">📍 ${dist} km</span>
               <span class="badge">⭐ ${rating} (${total})</span>
            </div>
            <div class="map-link"><a href="${mapUrl}" target="_blank">開啟 Google Maps 導航 🗺️</a></div>
            ${mapEmbed}
          </div>
        `;
      }).join("");

      restaurantResult.innerHTML = `<div class="card-stack">${html}</div><div class="hint-footer">不滿意？按「再抽一次」🎲</div>`;
    }

    // ---- 初始化事件 ----
    document.addEventListener("DOMContentLoaded", () => {
      const detectBtn = document.getElementById("detectBtn");
      const radiusInput = document.getElementById("radiusInput");
      const statusMsg = document.getElementById("statusMsg");
      const categoryList = document.getElementById("categoryList");
      const categorySubtitle = document.getElementById("categorySubtitle");
      const startRandomBtn = document.getElementById("startRandomBtn");
      const reshuffleBtn = document.getElementById("reshuffleBtn");
      const restaurantResult = document.getElementById("restaurantResult");
      const ratingFilter = document.getElementById("ratingFilter");
      const debugListEl = document.getElementById("debugList");
      const toggleDebugBtn = document.getElementById("toggleDebugBtn");

      // Debug 開關
      toggleDebugBtn.addEventListener("click", () => {
        const isHidden = getComputedStyle(debugListEl).display === "none";
        debugListEl.style.display = isHidden ? "block" : "none";
      });

      // 定位按鈕
      detectBtn.addEventListener("click", () => {
        if (!navigator.geolocation) {
          statusMsg.textContent = "瀏覽器不支援定位。";
          return;
        }
        statusMsg.textContent = "定位中...";
        navigator.geolocation.getCurrentPosition(pos => {
          userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          searchNearbyRestaurants(statusMsg, categoryList, restaurantResult, categorySubtitle, startRandomBtn, reshuffleBtn, radiusInput, debugListEl);
        }, err => {
          statusMsg.textContent = "定位失敗，請檢查權限。";
        });
      });

      // 抽籤按鈕
      startRandomBtn.addEventListener("click", () => pickRandomRestaurant(categoryList, restaurantResult, ratingFilter));
      reshuffleBtn.addEventListener("click", () => pickRandomRestaurant(categoryList, restaurantResult, ratingFilter));
    });
  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&language=zh-TW"></script>
</body>
</html>
