<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吃什麼轉盤 v0.6.0</title>
  <style>
    :root {
      --primary: #ffb7d5; /* 奶霜粉系主色 */
      --primary-dark: #e08db0;
      --bg: #fff7fb;
      --card-bg: #ffffff;
      --text-main: #4a4a4a;
      --text-sub: #8b8b8b;
      --border-subtle: #f2dce6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial;
      background: radial-gradient(circle at top, #ffeef7 0, #fff7fb 45%, #ffffff 100%);
      display: flex;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: #ffffffec;
      border-radius: 24px;
      box-shadow:
        0 14px 30px rgba(255, 182, 210, 0.35),
        0 0 0 1px rgba(252, 231, 243, 0.9);
      padding: 18px 16px 16px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .app-subtitle {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .version-chip {
      background: #ffe9f2;
      border: 1px solid #ffcbe1;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: #b95880;
    }

    .radius-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .radius-row label {
      font-size: 13px;
      color: var(--text-sub);
    }

    input[type=number] {
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      font-size: 13px;
      width: 70px;
      outline: none;
    }

    input[type=number]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(255, 183, 213, 0.5);
    }

    .btn {
      background: linear-gradient(135deg, #ffb7d5, #ffc6de);
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 165, 195, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 6px rgba(255, 165, 195, 0.4);
    }

    .btn.secondary {
      background: #ffe9f2;
      color: #b95880;
      box-shadow: none;
    }

    .status {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-sub);
      min-height: 16px;
    }

    .card {
      margin-top: 12px;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 12px 12px 10px;
      border: 1px solid var(--border-subtle);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--text-sub);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .cat-item {
      background: #fff0f6;
      border: 1px solid #ffd9e8;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
      display: flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
    }

    .cat-item input {
      margin: 0;
    }

    /* --- 抽卡滑條（iOS 風格） --- */
    .slider-wrap {
      margin-top: 4px;
      text-align: center;
    }

    #cardCountRange {
      width: 80%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 4px;
      background: #ffd9e8;
      outline: none;
    }

    #cardCountRange::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--primary);
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(255, 165, 195, 0.4);
    }

    #cardCountRange::-moz-range-thumb {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--primary);
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(255, 165, 195, 0.4);
    }

    #selectedCardCountLabel {
      font-size: 13px;
      margin-top: 6px;
      color: var(--primary-dark);
    }

    /* 抽出的卡片 */
    .restaurant-card {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ffd9e8;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 6px 14px rgba(255, 182, 210, 0.18);
      animation: card-pop 0.25s ease-out;
    }

    @keyframes card-pop {
      from {
        transform: translateY(10px) scale(0.97);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .restaurant-name {
      font-size: 15px;
      font-weight: 600;
      color: #b95880;
    }

    .restaurant-meta {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .restaurant-link a {
      display: inline-block;
      margin-top: 6px;
      font-size: 13px;
      color: #ff7aa5;
      text-decoration: none;
    }

    .restaurant-link a:hover {
      text-decoration: underline;
    }

    /* --- 統一顯示一張總地圖 --- */
    #singleMapContainer iframe {
      width: 100%;
      height: 200px;
      border-radius: 14px;
      border: 1px solid #ffd9e8;
      margin-top: 8px;
    }

    #singleMapContainer-empty {
      font-size: 12px;
      color: var(--text-sub);
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: flex-end;
    }

    @media (max-width: 420px) {
      .app {
        padding-inline: 12px;
      }
      .footer-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .footer-actions .btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title-row">
      <div>
        <div class="app-title">吃什麼轉盤 🍰</div>
        <div class="app-subtitle">選類型 → 選距離 → 抽 1～3 張卡幫你決定</div>
      </div>
      <div class="version-chip">v0.6.0</div>
    </div>

    <div class="radius-row">
      <label>距離
        <input type="number" id="radiusInput" value="5" min="1" max="10" />
        公里內
      </label>
      <button class="btn" id="detectBtn">📍 定位並載入</button>
    </div>

    <div id="statusMsg" class="status"></div>

    <div class="card">
      <div class="card-title">
        <span>餐廳類型</span>
        <span class="card-subtitle">可複選，不選等於「全部都可以」</span>
      </div>
      <div id="categoryList" class="categories"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>抽卡數量</span>
        <span class="card-subtitle">最少 1 張，最多 3 張</span>
      </div>
      <div class="slider-wrap">
        <input id="cardCountRange" type="range" min="1" max="3" step="1" value="3" />
        <div id="selectedCardCountLabel">抽 3 張</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>抽到的餐廳</span>
        <span class="card-subtitle">按下開始抽籤，會顯示 1～3 張卡片</span>
      </div>
      <div id="restaurantResult">按「開始抽籤」開始 🎲</div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>地圖顯示</span>
        <span class="card-subtitle">只顯示第一家抽到的餐廳位置</span>
      </div>
      <div id="singleMapContainer">
        <div id="singleMapContainer-empty">尚未有結果，抽到餐廳後會顯示地圖。</div>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn secondary" id="startRandomBtn" disabled>開始抽籤 🎯</button>
      <button class="btn" id="reshuffleBtn" disabled>再抽一次 🔄</button>
    </div>
  </div>

  <!-- 請把 YOUR_GOOGLE_MAPS_API_KEY 換成你的金鑰 -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAzah5t1zIXY-Yg05uZKFYtVmlT4Pe0ZUQ&libraries=places,geometry"></script>

  <script>
    // v0.6.0 JS

    let userLocation = null;
    let allPlaces = [];      // 主餐廳
    let drinkPlaces = null;  // 飲料搜尋結果（cache）
    const FETCH_RADIUS_KM = 10;
    const MAX_RESULTS = 60;

    const detectBtn = document.getElementById("detectBtn");
    const startRandomBtn = document.getElementById("startRandomBtn");
    const reshuffleBtn = document.getElementById("reshuffleBtn");
    const statusMsg = document.getElementById("statusMsg");
    const radiusInput = document.getElementById("radiusInput");
    const categoryList = document.getElementById("categoryList");
    const restaurantResult = document.getElementById("restaurantResult");
    const singleMapContainer = document.getElementById("singleMapContainer");
    const cardCountRange = document.getElementById("cardCountRange");
    const selectedCardCountLabel = document.getElementById("selectedCardCountLabel");

    // 初始化滑條文字
    cardCountRange.addEventListener("input", () => {
      selectedCardCountLabel.textContent = `抽 ${cardCountRange.value} 張`;
    });

    document.addEventListener("DOMContentLoaded", () => {
      detectBtn.addEventListener("click", detectLocation);
      radiusInput.addEventListener("change", () => {
        restaurantResult.textContent = "距離已更新，請重新抽籤 🎲";
      });
      startRandomBtn.addEventListener("click", () => pickRandomRestaurant());
      reshuffleBtn.addEventListener("click", () => pickRandomRestaurant());

      // 建立類別 checkbox
      buildCategoryCheckboxes();
    });

    function buildCategoryCheckboxes() {
      const cats = ["早餐", "午餐", "晚餐", "下午茶", "飲料"];
      categoryList.innerHTML = "";
      cats.forEach(c => {
        const id = "cat_" + c;
        const label = document.createElement("label");
        label.className = "cat-item";
        label.innerHTML = `
          <input type="checkbox" id="${id}" value="${c}" />
          <span>${c}</span>
        `;
        categoryList.appendChild(label);
      });
    }

    function detectLocation() {
      if (!navigator.geolocation) {
        statusMsg.textContent = "你的瀏覽器不支援定位功能。";
        return;
      }
      statusMsg.textContent = "正在取得你的位置…";

      navigator.geolocation.getCurrentPosition(
        pos => {
          userLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };
          statusMsg.textContent = "已取得位置，正在搜尋附近餐廳…";
          searchNearbyRestaurants();
        },
        err => {
          console.error(err);
          statusMsg.textContent = "無法取得定位，請確認已開啟定位權限。";
        }
      );
    }

    function searchNearbyRestaurants() {
      if (!userLocation) return;
      const service = new google.maps.places.PlacesService(document.createElement("div"));

      const request = {
        location: new google.maps.LatLng(userLocation.lat, userLocation.lng),
        rankBy: google.maps.places.RankBy.DISTANCE,
        type: "restaurant"
      };

      allPlaces = [];
      drinkPlaces = null;
      startRandomBtn.disabled = true;
      reshuffleBtn.disabled = true;
      restaurantResult.textContent = "正在載入附近餐廳…";

      service.nearbySearch(request, function handle(results, status, pagination) {
        if (status === google.maps.places.PlacesServiceStatus.OK && results) {
          const remaining = MAX_RESULTS - allPlaces.length;
          if (remaining > 0) {
            allPlaces = allPlaces.concat(results.slice(0, remaining));
          }
        }

        if (pagination && pagination.hasNextPage && allPlaces.length < MAX_RESULTS) {
          setTimeout(() => pagination.nextPage(), 350);
        } else {
          // 計算距離
          attachDistance(allPlaces);
          statusMsg.textContent = `已載入 ${allPlaces.length} 家餐廳，選好類型後即可抽籤。`;
          startRandomBtn.disabled = false;
          reshuffleBtn.disabled = false;
        }
      });
    }

    function attachDistance(list) {
      if (!userLocation || !google.maps.geometry) return;
      const origin = new google.maps.LatLng(userLocation.lat, userLocation.lng);
      list.forEach(p => {
        try {
          const distMeters = google.maps.geometry.spherical.computeDistanceBetween(
            origin,
            p.geometry.location
          );
          p._dist = distMeters / 1000; // km
        } catch (e) {
          p._dist = Infinity;
        }
      });
    }

    function getPlacesWithinRadius() {
      const r = Number(radiusInput.value) || 5;
      return allPlaces.filter(p => (p._dist ?? Infinity) <= r);
    }

    async function fetchDrinkPlacesIfNeeded() {
      if (drinkPlaces !== null) return drinkPlaces;
      if (!userLocation) return [];

      const service = new google.maps.places.PlacesService(document.createElement("div"));
      const request = {
        location: new google.maps.LatLng(userLocation.lat, userLocation.lng),
        radius: FETCH_RADIUS_KM * 1000,
        keyword: "飲料 手搖 手搖飲 奶茶 咖啡 coffee tea 紅茶 綠茶 珍珠"
      };

      drinkPlaces = [];

      return new Promise(resolve => {
        service.nearbySearch(request, function handle(results, status, pagination) {
          if (status === google.maps.places.PlacesServiceStatus.OK && results) {
            drinkPlaces = drinkPlaces.concat(results);
          }
          if (pagination && pagination.hasNextPage && drinkPlaces.length < MAX_RESULTS) {
            setTimeout(() => pagination.nextPage(), 350);
          } else {
            attachDistance(drinkPlaces);
            resolve(drinkPlaces);
          }
        });
      });
    }

    // 回傳「這間店屬於哪些類型」
    function classifyPlaceLabels(place) {
      const text = (place.name || "") + " " +
                   (place.vicinity || "") + " " +
                   (place.formatted_address || "");
      const labels = [];

      // 早餐關鍵字
      if (/早餐|早午餐|brunch|豆漿|蛋餅|吐司|三明治|美而美|早點/i.test(text)) {
        labels.push("早餐");
      }

      // 下午茶關鍵字
      if (/下午茶|甜點|蛋糕|鬆餅|司康|冰淇淋|冰品|dessert/i.test(text)) {
        labels.push("下午茶");
      }

      // 飲料 / 咖啡關鍵字
      if (/飲料|手搖|手搖飲|奶茶|紅茶|綠茶|茶坊|cafe|coffee|咖啡|果汁|smoothie|冰沙/i.test(text)) {
        labels.push("飲料");
      }

      // 如果完全沒判斷出來，就當作主餐
      if (labels.length === 0) {
        labels.push("午餐", "晚餐");
      }

      return labels;
    }

    async function pickRandomRestaurant() {
      if (!userLocation || !allPlaces.length) {
        restaurantResult.textContent = "請先按「定位並載入」取得附近餐廳。";
        return;
      }

      const selectedCats = Array.from(
        categoryList.querySelectorAll("input[type=checkbox]:checked")
      ).map(i => i.value);

      if (!selectedCats.length) {
        restaurantResult.textContent = "請至少選擇 1 種餐廳類型。";
        return;
      }

      const within = getPlacesWithinRadius();
      const poolMap = new Map();
      const radiusKm = Number(radiusInput.value) || 5;
      const nonDrinkCats = selectedCats.filter(c => c !== "飲料");

      // 主餐廳根據 selectedCats 過濾
      within.forEach(p => {
        const labels = classifyPlaceLabels(p);
        // 若選了非飲料類別，需至少有交集
        if (nonDrinkCats.length > 0) {
          if (!labels.some(l => nonDrinkCats.includes(l))) return;
        }
        // 若沒選非飲料類別（只有飲料），這些主餐就先不加
        if (nonDrinkCats.length === 0) return;

        if (!poolMap.has(p.place_id)) {
          poolMap.set(p.place_id, p);
        }
      });

      // 飲料類：額外用 keyword 抓
      if (selectedCats.includes("飲料")) {
        const drinks = await fetchDrinkPlacesIfNeeded();
        const filteredDrinks = drinks.filter(p => (p._dist ?? Infinity) <= radiusKm);
        filteredDrinks.forEach(p => {
          p._isDrink = true;
          if (!poolMap.has(p.place_id)) {
            poolMap.set(p.place_id, p);
          }
        });

        // 也把主餐中被判定成「飲料」的咖啡店納入
        within.forEach(p => {
          const labels = classifyPlaceLabels(p);
          if (labels.includes("飲料") && !poolMap.has(p.place_id)) {
            p._isDrink = true;
            poolMap.set(p.place_id, p);
          }
        });
      }

      const pool = Array.from(poolMap.values());

      if (!pool.length) {
        restaurantResult.textContent = "這個距離與條件下暫時找不到店家，試著放寬距離看看 🍽️";
        singleMapContainer.innerHTML = '<div id="singleMapContainer-empty">尚未有結果，抽到餐廳後會顯示地圖。</div>';
        return;
      }

      // 先照距離排序，再隨機打亂一點點
      pool.sort((a, b) => (a._dist ?? Infinity) - (b._dist ?? Infinity));
      pool.sort(() => Math.random() - 0.5);

      const count = Number(cardCountRange.value) || 1;
      const finalCount = Math.min(count, pool.length);
      const selected = pool.slice(0, finalCount);

      renderCards(selected);
      renderSingleMap(selected[0]);
    }

    function renderCards(list) {
      restaurantResult.innerHTML = list.map(p => {
        const dist = (p._dist ?? 0).toFixed(2);
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}&query_place_id=${p.place_id || ""}`;
        const drinkTag = p._isDrink ? "　🧋 飲料" : "";
        return `
          <div class="restaurant-card">
            <div class="restaurant-name">${p.name || "未命名餐廳"}${drinkTag}</div>
            <div class="restaurant-meta">
              距離：約 ${dist} km
            </div>
            <div class="restaurant-link">
              <a href="${mapsUrl}" target="_blank">➡ 打開 Google 地圖導航</a>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderSingleMap(place) {
      if (!place || !place.geometry || !place.geometry.location) {
        singleMapContainer.innerHTML = '<div id="singleMapContainer-empty">無法取得地圖位置。</div>';
        return;
      }
      const lat = place.geometry.location.lat();
      const lng = place.geometry.location.lng();
      singleMapContainer.innerHTML = `
        <iframe
          src="https://www.google.com/maps?q=${lat},${lng}&z=16&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      `;
    }
  </script>
</body>
</html>
